name: Build and deploy

# Despliega en Cloudflare Pages (proyecto personal-site, cuenta Ppardalj):
# push a master -> producción (www.ppardalj.com); PR -> preview en <rama>.personal-site-dln.pages.dev.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Los PRs desde forks no tienen acceso a los secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read Hugo version
        id: hugo
        run: echo "version=$(cat .hugo-version)" >> "$GITHUB_OUTPUT"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}
          extended: true

      # Hugo >= 0.170 needs Dart Sass for css.Sass
      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Build Hugo site
        # En previews, URLs relativas para que los enlaces no salten a producción.
        run: HUGO_ENV=production hugo --minify --logLevel info ${{ github.event_name == 'pull_request' && '--baseURL /' || '' }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=personal-site --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "Preview: $URL"
