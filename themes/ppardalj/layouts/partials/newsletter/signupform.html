<script src="https://f.convertkit.com/ckjs/ck.5.js"></script>
<form
  class="signup-form"
  action="https://app.kit.com/forms/7608370/subscriptions"
  method="post"
>
  <div class="form-row">
    <div class="col-md-6 form-group">
      <label for="first_name">Nombre</label>
      <input
        class="form-control required text"
        type="text"
        name="first_name"
        id="first_name"
        value=""
        placeholder="Tu nombre"
        required
      />
    </div>
    <div class="col-md-6 form-group">
      <label for="email_address">Email</label>
      <input
        class="form-control required email"
        type="email"
        name="email_address"
        id="email_address"
        value=""
        placeholder="Tu email"
        required
      />
    </div>
  </div>
  <div class="mt-4">
    <input
      type="submit"
      name="subscribe"
      class="button"
      value="Suscribirme gratis"
    />
  </div>
</form>
