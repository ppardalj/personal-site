<div class="preventry">
  <span class="preventry-number">v1.{{ .Params.issue_number }}</span>
  <div class="preventry-content">
    <p class="preventry-title">{{ .Title }}</p>
    <p class="preventry-date">{{ .Date.Format "January 2, 2006" }}</p>
  </div>
  <img class="preventry-arrow" src="/assets/img/brand/arrow-down.svg" alt="" />
  <a href="{{ .Permalink }}" aria-label="{{ .Title }}"></a>
</div>
