{{ $author := index .Site.Data.authors .Params.author }}
<article class="post-card">
  <a class="post-card-overlay" href="{{ .Permalink }}" aria-label="{{ .Title }}"></a>
  <div class="post-card-image" style="background-image: url('{{ .Params.card_image | absURL }}');"></div>
  <div class="post-card-body">
    {{ if .Params.tags }}
    <ul class="tags tags-card">
      {{ range $i, $tag := .Params.tags }}<li><a href="{{ relLangURL ( printf "tags/%s/" ( $tag | urlize ) ) }}">#{{ $tag }}</a></li>{{ end }}
    </ul>
    {{ end }}
    <div class="post-title">
      <h2>{{ .Title }}</h2>
      {{ if $author }}<p class="author">{{ $author.name }}</p>{{ end }}
    </div>
  </div>
</article>
