<section id="{{ .id }}" class="{{ .className }}">
  <div class="container">
    <div class="row">
      <div class="col-md-5 d-none d-sm-none d-md-block">
        <img
          class="img-fluid guide-photo"
          src="{{ .image }}"
          alt="{{ .title }}"
        />
      </div>
      <div class="col-md-7">
        {{- partial "arrow-header.html" (dict "header" .title) }}
        <p>
          {{ .p1 | safeHTML }}
        </p>
        <p>
          {{ .p2 | safeHTML }}
        </p>
      </div>
    </div>
  </div>
</section>
<div class="band" aria-hidden="true"></div>
