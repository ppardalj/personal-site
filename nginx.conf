server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;
    # Redirecciones relativas (p. ej. /newsletter → /newsletter/) para no saltar a http ni a localhost detrás del proxy
    absolute_redirect off;

    # La consultoría a título personal se hace desde Exeal (decisión del 2026-11-20).
    # Las UTM permiten medir en la analítica de Exeal lo que llega desde la marca personal (D002).
    location ~ ^/team-coaching/?$ {
        return 301 https://www.exeal.com/servicios/?utm_source=ppardalj&utm_medium=referral&utm_campaign=team-coaching;
    }
    location ~ ^/conversation/?$ {
        return 301 https://www.exeal.com/contacto/?utm_source=ppardalj&utm_medium=referral&utm_campaign=conversation;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
